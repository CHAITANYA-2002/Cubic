<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="CubicTech" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- unicode-range subsets: Devanagari and Arabic files download only on pages that use them -->
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <!-- Reveal-on-scroll is enabled before first paint; style rules keep content visible if JS never runs. -->
    <script>if(!matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("motion-ok")</script>
    <!-- Intro: CSS-only so it plays before JavaScript loads; main.tsx removes it on repeat visits. -->
    <style>
      #intro{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#000;animation:intro-out .6s cubic-bezier(.65,0,.35,1) 1.05s forwards;pointer-events:none}
      #intro .intro-box{display:flex;align-items:center;gap:14px;opacity:0;transform:scale(.96);animation:intro-in .7s cubic-bezier(.16,1,.3,1) .1s forwards}
      #intro svg{width:40px;height:40px}
      #intro .word{font:600 26px/1 Inter,system-ui,sans-serif;letter-spacing:-.03em;color:#f5f5f7}
      @keyframes intro-in{to{opacity:1;transform:none}}
      @keyframes intro-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#intro{display:none}}
    </style>
<!--app-head-->
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-box">
        <svg viewBox="0 0 40 40">
          <defs>
            <linearGradient id="it" x1="6" y1="4" x2="34" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6dcbc"/><stop offset="1" stop-color="#d6a77a"/></linearGradient>
            <linearGradient id="ir" x1="34" y1="14" x2="21" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c48c5c"/><stop offset="1" stop-color="#8a5a35"/></linearGradient>
            <linearGradient id="il" x1="6" y1="14" x2="19" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2b8f83"/><stop offset="1" stop-color="#123d38"/></linearGradient>
          </defs>
          <path d="M20 4 34 12 20 20 6 12z" fill="url(#it)"/>
          <path d="M6 14.2 18.9 21.6v15.2L6 29.4z" fill="url(#il)"/>
          <path d="M34 14.2 21.1 21.6v15.2L34 29.4z" fill="url(#ir)"/>
        </svg>
        <span class="word">CubicTech</span>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
