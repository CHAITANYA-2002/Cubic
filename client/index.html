<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="author" content="CubicTech" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- unicode-range subsets: Devanagari and Arabic files download only on pages that use them -->
    <link href="/fonts/fonts.css" rel="stylesheet" />
    <!-- Intro: CSS-only so it plays before JavaScript loads; main.tsx removes it on repeat visits. -->
    <style>
      #intro{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,#1a140e 0%,#0a0a0b 70%);animation:intro-out .55s cubic-bezier(.7,0,.2,1) 1.45s forwards;pointer-events:none}
      #intro .intro-box{display:flex;flex-direction:column;align-items:center;gap:18px}
      #intro svg{width:104px;height:104px;overflow:visible;animation:intro-lift .55s cubic-bezier(.7,0,.2,1) 1.45s forwards}
      #intro .edge{fill:none;stroke:#d6a77a;stroke-width:.6;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:intro-draw .75s cubic-bezier(.65,0,.35,1) forwards}
      #intro .edge:nth-of-type(2){animation-delay:.12s}#intro .edge:nth-of-type(3){animation-delay:.24s}
      #intro .face{opacity:0;animation:intro-fill .45s ease-out forwards}
      #intro .f1{animation-delay:.55s}#intro .f2{animation-delay:.68s}#intro .f3{animation-delay:.8s}
      #intro .word{font:600 38px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em;color:#f4f4f5;clip-path:inset(0 100% 0 0);animation:intro-word .6s cubic-bezier(.65,0,.35,1) .75s forwards}
      #intro .word b{font-weight:600;font-style:italic;color:#d6a77a}
      #intro .bar{width:160px;height:1px;background:rgba(255,255,255,.08);overflow:hidden}
      #intro .bar i{display:block;height:100%;background:linear-gradient(90deg,#2b8f83,#d6a77a);transform:scaleX(0);transform-origin:0 50%;animation:intro-bar 1.3s cubic-bezier(.65,0,.35,1) forwards}
      @keyframes intro-draw{to{stroke-dashoffset:0}}
      @keyframes intro-fill{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
      @keyframes intro-word{to{clip-path:inset(0 0 0 0)}}
      @keyframes intro-bar{to{transform:scaleX(1)}}
      @keyframes intro-lift{to{transform:translateY(-6px) scale(1.06)}}
      @keyframes intro-out{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#intro{display:none}}
    </style>
<!--app-head-->
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro-box">
        <svg viewBox="0 0 40 40">
          <defs>
            <linearGradient id="it" x1="6" y1="4" x2="34" y2="20" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f6dcbc"/><stop offset="1" stop-color="#d6a77a"/></linearGradient>
            <linearGradient id="ir" x1="34" y1="14" x2="21" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c48c5c"/><stop offset="1" stop-color="#8a5a35"/></linearGradient>
            <linearGradient id="il" x1="6" y1="14" x2="19" y2="37" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2b8f83"/><stop offset="1" stop-color="#123d38"/></linearGradient>
          </defs>
          <path class="edge" d="M20 4 34 12 20 20 6 12z"/>
          <path class="edge" d="M6 14.2 18.9 21.6v15.2L6 29.4z"/>
          <path class="edge" d="M34 14.2 21.1 21.6v15.2L34 29.4z"/>
          <path class="face f1" d="M20 4 34 12 20 20 6 12z" fill="url(#it)"/>
          <path class="face f2" d="M6 14.2 18.9 21.6v15.2L6 29.4z" fill="url(#il)"/>
          <path class="face f3" d="M34 14.2 21.1 21.6v15.2L34 29.4z" fill="url(#ir)"/>
        </svg>
        <span class="word"><b>Cubic</b>Tech</span>
        <span class="bar"><i></i></span>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
